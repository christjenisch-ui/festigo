<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="FestiGo: festival map, lineup, friends and Momento for Brisa Fest 2027 in València.">
<meta name="theme-color" content="#0F0D2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FestiGo">
<title>FestiGo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: one full-screen app column. On large screens it floats on a summer-poster ground with a striped sunset disc. */
:root{
  --bg:#FFC93C; --accent:#E8336D; --accent2:#FF7A3D;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
  /* app: one fixed night palette, the festival runs after dark */
  --a-bg:#0F0D2E; --a-s1:#1A1748; --a-s2:#262262; --a-ink:#FFF6E5; --a-dim:#A9A3D6;
  --a-sun:#FFC53D; --a-coral:#FF5C8A; --a-sea:#2EC4B6; --a-sky:#5BB8FF; --a-leaf:#7BD389; --a-red:#FF6B57;
  --a-line:rgba(255,246,229,.10);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#16133D; --accent:#FF5C8A; --accent2:#FFB03A } }
:root[data-theme="dark"]{ --bg:#16133D; --accent:#FF5C8A; --accent2:#FFB03A }

[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%; margin:0}
body{background:var(--a-bg); color:var(--a-ink); font-family:var(--f-body); font-size:14px; -webkit-font-smoothing:antialiased; overscroll-behavior:none}
img{max-width:100%}
button{font:inherit; color:inherit; cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--a-sun); outline-offset:2px}

.shell{position:relative; height:100%; display:grid; place-items:center; overflow:hidden}
.sun{display:none}
.app{position:relative; width:100%; max-width:480px; height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
  background:var(--a-bg); color:var(--a-ink); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); box-sizing:border-box}
@media (min-width:640px) and (min-height:720px){
  body{background:var(--bg)}
  .sun{display:block; position:absolute; width:min(640px,90vw); aspect-ratio:1; border-radius:50%; background:linear-gradient(180deg,var(--accent2),var(--accent));
    -webkit-mask-image:linear-gradient(180deg,#000 0 56%,transparent 56% 60%,#000 60% 67%,transparent 67% 72%,#000 72% 78%,transparent 78% 84%,#000 84% 89%,transparent 89%);
            mask-image:linear-gradient(180deg,#000 0 56%,transparent 56% 60%,#000 60% 67%,transparent 67% 72%,#000 72% 78%,transparent 78% 84%,#000 84% 89%,transparent 89%)}
  .app{height:min(880px, calc(100dvh - 48px)); border-radius:36px; box-shadow:0 0 0 2px #2C2962, 0 40px 90px -24px rgba(16,8,60,.6)}
}

/* header */
.ah{flex:none; display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding:calc(var(--sat) + 14px) 18px 10px}
.ah small{display:block; font-family:var(--f-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--a-dim)}
.ah h2{margin:2px 0 0; font-family:var(--f-display); font-weight:700; font-size:24px; letter-spacing:-.02em}
.me-btn{flex:none; width:40px; height:40px; border-radius:50%; border:2px solid var(--a-sun); background:var(--a-s2); color:var(--a-sun); font-weight:800; font-size:11px; display:grid; place-items:center; padding:0; position:relative}
.me-btn.on{background:var(--a-sun); color:var(--a-bg)}
.me-btn .gear{position:absolute; right:-4px; bottom:-4px; width:18px; height:18px; border-radius:50%; background:var(--a-bg); display:grid; place-items:center}
.me-btn .gear svg{width:13px; height:13px; fill:none; stroke:var(--a-ink); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}

.views{position:relative; flex:1; min-height:0}
.view{position:absolute; inset:0; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.view::-webkit-scrollbar{display:none}

.tabs{flex:none; display:grid; grid-template-columns:repeat(5,1fr); padding:6px 6px max(12px, var(--sab)); border-top:1px solid var(--a-line); background:var(--a-bg)}
.tab{display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:0; padding:6px 0; font-size:10.5px; font-weight:700; color:var(--a-dim); position:relative; min-width:0}
.tab span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.tab svg{width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.tab.on{color:var(--a-sun)}
.tab .dot{position:absolute; top:4px; right:calc(50% - 17px); width:9px; height:9px; border-radius:50%; background:var(--a-coral); border:2px solid var(--a-bg)}

/* notification banner + toast */
.notif{position:absolute; z-index:75; top:calc(var(--sat) + 10px); left:10px; right:10px; display:flex; gap:12px; align-items:center; text-align:left; padding:12px 14px; border-radius:22px; border:1px solid var(--a-line);
  background:rgba(38,34,98,.96); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--a-ink);
  transform:translateY(-180%); transition:transform .45s cubic-bezier(.2,1.2,.4,1); box-shadow:0 18px 40px -12px rgba(0,0,0,.6)}
.notif.show{transform:none}
.notif .ic{flex:none; width:38px; height:38px; border-radius:11px; background:var(--a-sun); display:grid; place-items:center}
.notif .ic svg{width:22px; height:22px; fill:none; stroke:var(--a-bg); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.notif b{display:block; font-size:13.5px}
.notif span{font-size:12.5px; color:var(--a-dim)}
.notif time{margin-left:auto; align-self:flex-start; font-size:11px; color:var(--a-dim)}
.toast{position:absolute; z-index:90; left:50%; bottom:calc(var(--sab) + 92px); translate:-50% 0; max-width:calc(100% - 40px); width:max-content; box-sizing:border-box;
  padding:10px 16px; border-radius:14px; background:var(--a-ink); color:var(--a-bg); font-weight:700; font-size:13px; line-height:1.35; text-align:center;
  opacity:0; transform:translateY(10px); transition:opacity .2s, transform .2s; pointer-events:none}
.toast.show{opacity:1; transform:none}

/* shared bits */
.pad{padding:0 14px 24px; display:grid; gap:12px}
.card{padding:14px; border-radius:20px; background:var(--a-s1); display:grid; gap:12px}
.row{display:flex; align-items:center; gap:12px; min-width:0}
.row > div{min-width:0}
.row > div.grow{flex:1}
.row b{font-size:14px}
.row small{display:block; color:var(--a-dim); font-size:12px; line-height:1.4}
.row.link{background:none; border:0; padding:0; text-align:left; width:100%; text-decoration:none}
.chev{margin-left:auto; flex:none; width:18px; height:18px; fill:none; stroke:var(--a-dim); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.gl{font-family:var(--f-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--a-dim); margin:4px 2px -4px; display:flex; justify-content:space-between; gap:8px}
.gl button{border:0; background:none; padding:0; color:var(--a-sun); font:inherit; letter-spacing:inherit; text-transform:inherit}
.sh-ic{flex:none; width:42px; height:42px; border-radius:13px; display:grid; place-items:center; background:var(--c); color:var(--k)}
.sh-ic svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round}
.sh-ic.sm{width:34px; height:34px; border-radius:11px}
.sh-ic.sm svg{width:18px; height:18px}
.acts{display:flex; gap:8px; margin-top:14px}
.btn{flex:1; display:inline-flex; justify-content:center; align-items:center; gap:7px; border:0; border-radius:14px; padding:11px 12px; font-weight:800; font-size:13px; background:var(--a-s2); color:var(--a-ink); text-decoration:none; text-align:center; box-sizing:border-box}
.btn.pri{background:var(--a-sun); color:var(--a-bg)}
.btn.big{padding:15px 16px; font-size:15px; border-radius:16px}
.btn:disabled{opacity:.5; cursor:default}
.btn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; flex:none}
.pills{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 0}
.pill{display:inline-flex; align-items:center; gap:5px; padding:5px 9px; border-radius:999px; font-size:11.5px; font-weight:700; background:var(--a-s2); color:var(--a-ink)}
.pill.good{background:rgba(123,211,137,.16); color:var(--a-leaf)}
.pill.warn{background:rgba(255,197,61,.16); color:var(--a-sun)}
.pill.bad{background:rgba(255,107,87,.16); color:var(--a-red)}
.sw{margin-left:auto; flex:none; width:50px; height:30px; border-radius:999px; border:0; padding:3px; background:var(--a-s2); position:relative; transition:background .2s}
.sw::after{content:""; display:block; width:24px; height:24px; border-radius:50%; background:var(--a-ink); transition:transform .2s}
.sw[aria-checked="true"]{background:var(--a-leaf)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.av{flex:none; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:12px; color:#0F0D2E; background:var(--c); position:relative}
.av.sm{width:30px; height:30px; font-size:10px}
.av.off{background:var(--a-s2); color:var(--a-dim); border:2px dashed var(--a-dim); box-sizing:border-box}
.av .on{position:absolute; right:-1px; bottom:-1px; width:11px; height:11px; border-radius:50%; background:var(--a-leaf); border:2px solid var(--a-s1)}
.live{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:800; letter-spacing:.08em; color:var(--a-coral)}
.live::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor; animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.empty{padding:28px 20px; text-align:center; color:var(--a-dim); font-size:13px; line-height:1.55}
.empty b{display:block; color:var(--a-ink); font-family:var(--f-display); font-size:16px; margin-bottom:4px}
.langs{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.langs button{display:flex; align-items:center; gap:10px; padding:12px; border-radius:14px; border:1.5px solid var(--a-line); background:none; font-weight:800; font-size:14px; text-align:left}
.langs button.on{border-color:var(--a-sun); background:rgba(255,197,61,.12); color:var(--a-sun)}
.lc{font-family:var(--f-mono); font-size:11px; font-weight:500; padding:3px 6px; border-radius:6px; background:var(--a-s2); color:var(--a-ink)}
.hintx{color:var(--a-dim); font-size:12px; line-height:1.45}

/* ---------- welcome ---------- */
.ob{position:absolute; inset:0; z-index:85; overflow-y:auto; display:flex; flex-direction:column; gap:22px;
  padding:calc(var(--sat) + 36px) 24px calc(var(--sab) + 24px); box-sizing:border-box;
  background:radial-gradient(120% 60% at 80% 0%, rgba(232,51,109,.55), transparent 60%), radial-gradient(90% 50% at 0% 30%, rgba(255,122,61,.25), transparent 60%), var(--a-bg)}
.ob .mark{display:flex; align-items:center; gap:12px; font-family:var(--f-display); font-weight:800; font-size:28px; letter-spacing:-.02em}
.ob .mark svg{width:46px; height:46px}
.ob h1{margin:0; font-family:var(--f-display); font-weight:700; font-size:32px; line-height:1.08; letter-spacing:-.03em; text-wrap:balance}
.ob h1 em{font-style:normal; color:var(--a-sun)}
.ob ul{list-style:none; margin:0; padding:0; display:grid; gap:12px}
.ob li{display:flex; gap:12px; align-items:center; font-size:14px; line-height:1.4}
.ob .fest{padding:14px; border-radius:18px; background:rgba(255,255,255,.06); border:1px solid var(--a-line); display:flex; gap:12px; align-items:center}
.ob .fest b{display:block; font-family:var(--f-display); font-size:15px}
.ob .fest small{color:var(--a-dim); font-size:12.5px}
.ob .grow{flex:1}

/* ---------- home ---------- */
.home{display:grid; gap:14px; padding:2px 0 28px}
.home > .sec{padding:0 14px; display:grid; gap:10px}
.hero{position:relative; overflow:hidden; margin:0 14px; padding:18px 18px 16px; border-radius:26px; color:#FFF6E5;
  background:linear-gradient(160deg,#FF8A3D 0%, #E8336D 52%, #6B2A9E 100%)}
.hero::after{content:""; position:absolute; right:-70px; top:-60px; width:230px; aspect-ratio:1; border-radius:50%; background:linear-gradient(180deg,#FFD25A,#FF8A3D);
  -webkit-mask-image:linear-gradient(180deg,#000 0 52%,transparent 52% 58%,#000 58% 66%,transparent 66% 72%,#000 72% 79%,transparent 79% 86%,#000 86%);
          mask-image:linear-gradient(180deg,#000 0 52%,transparent 52% 58%,#000 58% 66%,transparent 66% 72%,#000 72% 79%,transparent 79% 86%,#000 86%); opacity:.9}
.hero > *{position:relative; z-index:1}
.hero .ey{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.9}
.hero h3{margin:6px 0 2px; font-family:var(--f-display); font-weight:800; font-size:30px; line-height:1; letter-spacing:-.03em}
.hero .dt{font-weight:700; font-size:14px; opacity:.95}
.count{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px}
.count div{background:rgba(15,13,46,.32); border-radius:14px; padding:10px 6px; text-align:center}
.count b{display:block; font-family:var(--f-display); font-weight:700; font-size:24px; font-variant-numeric:tabular-nums}
.count span{font-size:11px; font-weight:700; opacity:.85}
.hero .status{margin-top:16px; padding:12px; border-radius:16px; background:rgba(15,13,46,.32); display:grid; gap:6px; font-size:13px}
.hero .status .live{color:#FFF6E5}
.qgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.qt{display:flex; align-items:center; gap:10px; padding:12px; border-radius:18px; background:var(--a-s1); border:0; text-align:left; font-weight:800; font-size:13.5px; min-width:0}
.qt span{min-width:0}
.qt small{display:block; font-weight:600; font-size:11.5px; color:var(--a-dim)}
.prow{display:grid; grid-template-columns:58px 1fr auto; gap:10px; align-items:center; padding:12px; border-radius:16px; background:var(--a-s1)}
.prow .t{font-family:var(--f-mono); font-size:11.5px; line-height:1.35; color:var(--a-dim)}
.prow .t b{display:block; color:var(--a-ink); font-weight:500; font-size:14px}
.prow .n{min-width:0}
.prow .n b{display:block; font-weight:800; font-size:14px}
.prow .n span{font-size:12px; color:var(--a-dim)}
.prow .n .stg{color:var(--c); font-weight:700}
.prow .warn{display:block; margin-top:4px; color:var(--a-red); font-size:11.5px; font-weight:700}
.prow button{border:0; background:none; padding:6px}
.prow button svg{width:20px; height:20px; fill:var(--a-sun); stroke:var(--a-sun); stroke-width:2}
.mcard{padding:14px; border-radius:20px; display:grid; gap:10px; background:var(--a-sun); color:var(--a-bg)}
.mcard.calm{background:var(--a-s1); color:var(--a-ink)}
.mcard .k{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.75}
.mcard p{margin:0; font-size:13px; line-height:1.5}
.mcard .btn.dark{background:var(--a-bg); color:var(--a-ink)}
.fstrip{display:flex; align-items:center; gap:12px; padding:12px; border-radius:18px; background:var(--a-s1); border:0; width:100%; text-align:left}
.fstrip .avs{display:flex}
.fstrip .avs .av{margin-left:-8px; border:2px solid var(--a-s1)}
.fstrip .avs .av:first-child{margin-left:0}
.fstrip > div{min-width:0}

/* ---------- map ---------- */
.v-map{overflow:hidden}
#map{display:block; width:100%; height:100%; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}
#map:active{cursor:grabbing}
#map text{font-family:var(--f-body)}
.zl{font-size:8px; font-weight:800; letter-spacing:.14em; fill:rgba(255,246,229,.38)}
.sea-l{font-size:10px; font-style:italic; font-weight:600; letter-spacing:.06em; fill:rgba(140,200,255,.55)}
.pin{cursor:pointer; transition:opacity .2s}
.pin.dim,.person.dim{opacity:.18}
.pl{font-size:8.5px; font-weight:800; letter-spacing:.08em; text-anchor:middle; fill:var(--a-ink); paint-order:stroke; stroke:var(--a-bg); stroke-width:3px}
.q{font-size:7.5px; font-weight:800; text-anchor:middle; fill:#0F0D2E}
.ring{fill:none; stroke:var(--a-ink); stroke-width:2}
.person{cursor:pointer; transition:opacity .2s}
.person .ini{font-size:8.5px; font-weight:800; text-anchor:middle; fill:#0F0D2E}
.person .nm{font-size:8px; font-weight:700; text-anchor:middle; fill:var(--a-ink); paint-order:stroke; stroke:var(--a-bg); stroke-width:3px}
.person.paused{opacity:.55}
.pulse{transform-box:fill-box; transform-origin:center; animation:pulse 2.2s ease-out infinite}
@keyframes pulse{from{transform:scale(1); opacity:.55} to{transform:scale(3.2); opacity:0}}
#route{fill:none; stroke:var(--a-sun); stroke-width:3.5; stroke-linecap:round; stroke-dasharray:1 7; animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-8}}
.chips{position:absolute; top:8px; left:0; right:0; display:flex; gap:6px; overflow-x:auto; padding:0 12px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:7px 12px; font-size:12px; font-weight:700; border:1px solid var(--a-line); background:rgba(26,23,72,.9); color:var(--a-ink); backdrop-filter:blur(6px)}
.chip i{width:8px; height:8px; border-radius:50%; background:var(--c)}
.chip.on{background:var(--a-ink); color:var(--a-bg)}
.mctl{position:absolute; right:12px; top:52px; display:flex; flex-direction:column; gap:8px}
.mctl button{width:40px; height:40px; border-radius:12px; border:1px solid var(--a-line); background:rgba(26,23,72,.92); display:grid; place-items:center; padding:0}
.mctl svg{width:18px; height:18px; fill:none; stroke:var(--a-ink); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.mctl button.ok{background:var(--a-leaf); border-color:var(--a-leaf)}
.mctl button.ok svg{stroke:var(--a-bg)}
.mctl button.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.legend{position:absolute; left:12px; top:52px; display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:10px; background:rgba(26,23,72,.9); font-size:11px; font-weight:700; color:var(--a-dim); max-width:calc(100% - 90px)}
.legend b{flex:none; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--a-dim)}
.legend.live b{background:var(--a-leaf); box-shadow:0 0 0 0 rgba(123,211,137,.6); animation:livep 1.6s infinite}
@keyframes livep{50%{box-shadow:0 0 0 5px rgba(123,211,137,0)}}
.meet-bar{position:absolute; left:12px; right:12px; top:52px; display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:var(--a-sun); color:var(--a-bg); font-weight:700; font-size:13px}
.meet-bar button{margin-left:auto; border:0; border-radius:999px; padding:6px 10px; background:var(--a-bg); color:var(--a-ink); font-size:12px; font-weight:700}
.sheet{position:absolute; left:8px; right:8px; bottom:8px; max-height:74%; overflow-y:auto; box-sizing:border-box; padding:8px 16px 16px; border-radius:24px; background:var(--a-s1); border:1px solid var(--a-line);
  transform:translateY(calc(100% + 24px)); transition:transform .32s cubic-bezier(.2,.9,.3,1); box-shadow:0 -10px 40px -10px rgba(0,0,0,.5); scrollbar-width:none}
.sheet.open{transform:none}
.grab{width:38px; height:4px; border-radius:4px; background:var(--a-line); margin:0 auto 10px}
.sh-h{display:flex; gap:12px; align-items:center}
.sh-h > div{min-width:0}
.sh-h h3{margin:0; font-family:var(--f-display); font-weight:700; font-size:17px; letter-spacing:-.01em}
.sh-h small{color:var(--a-dim); font-size:12px}
.x{margin-left:auto; flex:none; width:32px; height:32px; border-radius:50%; border:0; background:var(--a-s2); display:grid; place-items:center; padding:0}
.x svg{width:14px; height:14px; stroke:var(--a-ink); stroke-width:2.4; stroke-linecap:round; fill:none}
.sh-p{margin:12px 0 0; font-size:13px; line-height:1.5; color:var(--a-dim)}
.menu{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:6px}
.menu li{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding-bottom:6px; border-bottom:1px dashed var(--a-line)}
.np{margin-top:12px; padding:12px; border-radius:14px; background:var(--a-s2); display:grid; gap:6px; font-size:13px}
.np b{font-family:var(--f-display); font-weight:700; font-size:15px}
.np .mono{font-family:var(--f-mono); font-size:12px; color:var(--a-dim)}
.walk{margin-top:12px; display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:rgba(255,197,61,.12); color:var(--a-sun); font-weight:700; font-size:13px}
.walk span{font-family:var(--f-mono); font-weight:500}
.prog{height:8px; margin-top:14px; border-radius:8px; background:var(--a-s2); overflow:hidden}
.prog i{display:block; height:100%; border-radius:8px; background:var(--a-sky); transition:width .2s}

/* ---------- lineup ---------- */
.lu-top{position:sticky; top:0; z-index:5; background:var(--a-bg); padding:0 14px 8px; display:grid; gap:10px}
.seg2{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.seg2 button{border:1px solid var(--a-line); background:var(--a-s1); border-radius:12px; padding:7px 4px; display:grid; gap:1px; text-align:center}
.seg2 button b{font-family:var(--f-display); font-size:14px}
.seg2 button > span{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--a-dim)}
.seg2 button.on{background:var(--a-ink); color:var(--a-bg); border-color:var(--a-ink)}
.seg2 button.on > span{color:var(--a-bg); opacity:.7}
.seg{display:flex; padding:3px; border-radius:12px; background:var(--a-s1)}
.seg button{flex:1; border:0; background:none; border-radius:9px; padding:7px; font-size:12.5px; font-weight:700; color:var(--a-dim)}
.seg button.on{background:var(--a-s2); color:var(--a-ink)}
.seg em{font-style:normal; display:inline-block; min-width:16px; padding:0 4px; margin-left:4px; border-radius:8px; background:var(--a-sun); color:var(--a-bg); font-size:11px}
.tt-head{display:grid; grid-template-columns:34px repeat(3,minmax(0,1fr)); gap:5px}
.tt-head div{font-family:var(--f-display); font-weight:700; font-size:11px; text-align:center; padding:6px 0; border-radius:8px; color:var(--c); background:color-mix(in srgb, var(--c) 14%, transparent)}
.live-strip{margin:2px 14px 10px; padding:10px 12px; border-radius:14px; background:var(--a-s1); display:grid; gap:6px; font-size:12.5px}
.live-strip div{display:flex; gap:8px; align-items:baseline; min-width:0}
.live-strip b{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.live-strip span.st{margin-left:auto; flex:none; color:var(--a-dim); font-size:11.5px}
.tt-body{position:relative; display:grid; grid-template-columns:34px repeat(3,minmax(0,1fr)); gap:5px; margin:0 14px 20px}
.hr{position:absolute; left:0; right:0; border-top:1px solid var(--a-line); pointer-events:none}
.hr span{position:absolute; top:-7px; left:0; font-family:var(--f-mono); font-size:10px; color:var(--a-dim); background:var(--a-bg); padding-right:3px}
.col{position:relative; grid-row:1}
.set{position:absolute; left:0; right:0; box-sizing:border-box; padding:6px 6px 5px; border-radius:10px; text-align:left; border:1px solid color-mix(in srgb, var(--c) 45%, transparent);
  background:color-mix(in srgb, var(--c) 16%, var(--a-bg)); color:var(--a-ink); overflow:hidden; display:flex; flex-direction:column; gap:2px; transition:background .15s}
.set .tm{font-family:var(--f-mono); font-size:9.5px; color:var(--a-dim); padding-right:14px; white-space:nowrap; overflow:hidden; text-overflow:clip}
.set .an{font-weight:800; font-size:11.5px; line-height:1.2}
.set .gn{font-size:10px; color:var(--a-dim)}
.set .star{position:absolute; right:5px; top:5px; width:13px; height:13px; fill:none; stroke:var(--a-dim); stroke-width:2}
.set.fav{background:var(--c); color:#0F0D2E; border-color:var(--c)}
.set.fav .tm,.set.fav .gn{color:rgba(15,13,46,.7)}
.set.fav .star{fill:#0F0D2E; stroke:#0F0D2E}
.set.clash{outline:2px dashed var(--a-red); outline-offset:1px}
.set .lv{font-size:9px; font-weight:800; letter-spacing:.08em; color:var(--a-coral)}
.set.fav .lv{color:#0F0D2E}
.set.past{opacity:.5}
.nowline{position:absolute; left:30px; right:0; height:0; border-top:2px solid var(--a-sun); z-index:3; pointer-events:none}
.nowline::before{content:attr(data-t); position:absolute; left:-32px; top:-9px; font-family:var(--f-mono); font-size:9.5px; font-weight:500; background:var(--a-sun); color:var(--a-bg); padding:1px 3px; border-radius:4px}
.plan{padding:4px 14px 24px; display:grid; gap:8px}

/* ---------- friends ---------- */
.dur{display:flex; gap:6px}
.dur button{flex:1; border:1px solid var(--a-line); background:none; border-radius:10px; padding:7px 4px; font-size:12px; font-weight:700; color:var(--a-dim)}
.dur button.on{border-color:var(--a-leaf); color:var(--a-leaf); background:rgba(123,211,137,.1)}
.dur button:disabled{opacity:.4; cursor:default}
.frow{display:flex; align-items:center; gap:12px; padding:12px; border-radius:18px; background:var(--a-s1)}
.frow > div{min-width:0; flex:1}
.frow b{font-size:14px}
.frow small{display:block; color:var(--a-dim); font-size:12px; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.frow .m{font-family:var(--f-mono); font-size:11.5px; color:var(--a-ink)}
.ib{flex:none; width:38px; height:38px; border-radius:12px; border:0; background:var(--a-s2); display:grid; place-items:center; padding:0}
.ib svg{width:17px; height:17px; fill:none; stroke:var(--a-ink); stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round}
.meetc{background:linear-gradient(135deg, rgba(255,197,61,.18), rgba(255,92,138,.14)); border:1px solid rgba(255,197,61,.3)}
.code{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; border:1px dashed var(--a-line)}
.code span{font-family:var(--f-mono); font-size:12.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.code button{margin-left:auto; flex:none; border:0; border-radius:10px; padding:8px 12px; background:var(--a-sun); color:var(--a-bg); font-size:12px; font-weight:800}

/* ---------- momento ---------- */
.mbanner{margin:0 14px 14px; padding:16px; border-radius:22px; background:var(--a-sun); color:var(--a-bg); display:grid; gap:10px}
.mbanner.idle,.mbanner.done{background:var(--a-s1); color:var(--a-ink)}
.mbanner.done{border:1px solid rgba(123,211,137,.35)}
.mbanner .k{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.75}
.mbanner .big{font-family:var(--f-display); font-weight:800; font-size:38px; letter-spacing:-.02em; line-height:1; font-variant-numeric:tabular-nums}
.mbanner p{margin:0; font-size:13px; line-height:1.5}
.mbanner .btn.dark{background:var(--a-bg); color:var(--a-ink)}
.feed{padding:0 14px 24px; display:grid; gap:16px}
.fh{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--a-dim); display:flex; justify-content:space-between}
.post{display:grid; gap:8px}
.post header{display:flex; align-items:center; gap:10px}
.post header > div{min-width:0}
.post header b{font-size:13.5px}
.post header small{display:block; font-size:11.5px; color:var(--a-dim)}
.post header .late{margin-left:auto; flex:none; font-size:11px; font-weight:700; color:var(--a-red)}
.post header .ontime{margin-left:auto; flex:none; font-size:11px; font-weight:700; color:var(--a-leaf)}
.dual{position:relative; aspect-ratio:3/4; max-width:100%; border-radius:18px; overflow:hidden; background:var(--a-s1)}
.dual .b{display:block; width:100%; height:100%; object-fit:cover}
.dual .f{position:absolute; top:10px; left:10px; width:31%; aspect-ratio:3/4; object-fit:cover; border-radius:12px; border:2px solid var(--a-bg); cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.35)}
.lockd .dual img{filter:blur(18px) saturate(1.3); transform:scale(1.08)}
.lockd .dual .f{display:none}
.lockd .dual::after{content:attr(data-lock); position:absolute; inset:0; display:grid; place-items:center; padding:20px; text-align:center; font-weight:800; font-size:13px; color:var(--a-ink); background:rgba(15,13,46,.25)}
.lockd .cap,.lockd .rx{filter:blur(4px); pointer-events:none}
.cap{margin:0; font-size:13px; line-height:1.45}
.rx{display:flex; gap:6px; flex-wrap:wrap}
.rx button{border:1px solid var(--a-line); background:var(--a-s1); border-radius:999px; padding:4px 10px; font-size:12.5px; font-weight:700; display:inline-flex; gap:5px; align-items:center}
.rx button.mine{border-color:var(--a-sun); background:rgba(255,197,61,.14)}

/* camera */
.cam{position:absolute; inset:0; z-index:80; background:#000; display:flex; flex-direction:column; padding-top:calc(var(--sat) + 8px)}
.cam-top{display:flex; align-items:center; justify-content:space-between; padding:6px 16px 12px}
.cam-top .x{margin:0; background:rgba(255,255,255,.14)}
.cam-top .tm{font-family:var(--f-display); font-weight:800; font-size:20px; font-variant-numeric:tabular-nums}
.cam-top .tm.late{color:var(--a-red)}
.cam-top .lbl{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--a-dim); min-width:32px; text-align:right}
.cam-view{position:relative; margin:0 12px; border-radius:24px; overflow:hidden; aspect-ratio:3/4; max-width:100%; background:#111}
#camVideo{display:block; width:100%; height:100%; object-fit:cover; background:#111}
#camVideo.mirror{transform:scaleX(-1)}
.cam-thumb{position:absolute; top:12px; left:12px; width:30%; aspect-ratio:3/4; border-radius:14px; border:2px solid #000; object-fit:cover}
.flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
.flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.95} 100%{opacity:0}}
.cam-msg{position:absolute; left:50%; bottom:14px; translate:-50% 0; max-width:calc(100% - 28px); box-sizing:border-box; padding:7px 12px; border-radius:999px; background:rgba(0,0,0,.6); font-size:12.5px; font-weight:700; text-align:center}
.count3{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:96px; color:#fff; text-shadow:0 4px 30px rgba(0,0,0,.6); pointer-events:none}
.cam-err{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; background:#14122F; font-size:13.5px; line-height:1.5; color:var(--a-ink)}
.cam-err svg{width:40px; height:40px; fill:none; stroke:var(--a-dim); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.cam-err .btn{flex:none; width:100%; max-width:260px}
.cam-ctrl{margin-top:auto; display:flex; align-items:center; justify-content:space-around; padding:14px 20px calc(var(--sab) + 22px)}
.cam-ctrl label,.cam-ctrl .fl{width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.14); display:grid; place-items:center; cursor:pointer; border:0; padding:0; position:relative}
.cam-ctrl svg{width:21px; height:21px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.vh{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; overflow:hidden}
.shutter{width:78px; height:78px; border-radius:50%; border:5px solid #fff; background:transparent; padding:5px; display:grid; place-items:center}
.shutter::after{content:""; width:100%; height:100%; border-radius:50%; background:#fff; transition:transform .1s}
.shutter:active::after{transform:scale(.9)}
.shutter:disabled{opacity:.4}
.review{display:flex; flex-direction:column; gap:12px; padding:0 12px calc(var(--sab) + 22px); flex:1; min-height:0; overflow-y:auto}
.review .dual{flex:none}
.review input{width:100%; box-sizing:border-box; border-radius:14px; border:1px solid var(--a-line); background:var(--a-s1); color:var(--a-ink); padding:12px 14px; font:inherit; font-size:16px}
.review input::placeholder{color:var(--a-dim)}
.review .where{font-size:12.5px; color:var(--a-dim); display:flex; gap:6px; align-items:center}
.review .where svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2}
.about{text-align:center; color:var(--a-dim); font-size:12px; margin:4px 0 0; line-height:1.5}

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<div class="shell">
  <div class="sun" aria-hidden="true"></div>
  <div class="app" id="app">

    <button class="notif" id="notif" type="button" aria-live="polite">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>

    <header class="ah">

          <button id="zme" data-i18n-aria="zme" aria-label="Show my location"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>

          </div>
          <div class="seg" id="mode"><button data-mode="grid" class="on" data-i18n="mode.grid">All sets</button><button data-mode="plan"><span data-i18n="mode.plan">My plan</span><em id="planN">0</em></button></div>
          <div class="tt-head" id="ttHead"></div>

        <div id="ttWrap"></div>

      <section class="view" data-view="friends" hidden><div class="pad" id="friendsPad"></div></section>

    </main>

    <nav class="tabs" id="tabs">

      <button class="tab" data-go="lineup"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-i18n="tab.lineup">Lineup</span></button>
      <button class="tab" data-go="friends"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14a5 5 0 0 1 5 5"/></svg><span data-i18n="tab.friends">Friends</span></button>

<script>
(() => {
'use strict';
/* true only in the copy shared on claude.ai, where the page cannot open the live camera, GPS or offline cache */
const EMBED = false;
const SHARE_URL = 'https://claude.ai/artifact/2DJnU56WJmGtE5ab6a6wJF';

  return 2 * R * Math.asin(Math.sqrt(h));
}

function heroStatus() {
  const now = Date.now(), fn = festNow();
  if (now < FEST_START && !fn) {
    const ms = FEST_START - now, d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
    return `<div class="count"><div><b>${d}</b><span>${t('h.days')}</span></div><div><b>${h}</b><span>${t('h.hrs')}</span></div><div><b>${m}</b><span>${t('h.min')}</span></div></div>
      <div class="status">${t('h.starts')}</div>`;
  }
  if (fn) {
    const sets = setsFor(fn.day), n = fn.min, live = sets.filter(s => s.start <= n && n < s.end);
    const next = sets.filter(s => s.start > n).sort((a, b) => a.start - b.start)[0];
    const first = sets.slice().sort((a, b) => a.start - b.start)[0];
    let body;
    if (live.length) body = `<span class="live">${t('h.livenow')}</span>` + live.map(s => `<div><b>${esc(s.name)}</b> · ${s.stage.short} · ${t('until.l', { x: s.b })}</div>`).join('');
    else if (n < first.start) body = t('h.doors', { x: first.a });
    else if (next) body = t('h.between', { n: esc(next.name), x: next.a });
    else body = t('h.over');
    return `<div class="status"><span style="font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.85">${t('h.daylabel', { n: fn.n })}</span>${body}</div>`;
  }
  return `<div class="status">${t('h.over')}</div>`;
}
function planPreview() {
  const fn = festNow();
  let list = ALLSETS.filter(s => favs.has(s.id)).sort((a, b) => DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || a.start - b.start);
  if (fn) list = list.filter(s => DAYS.indexOf(s.day) > DAYS.indexOf(fn.day) || (s.day === fn.day && s.end > fn.min));
  return list.slice(0, 3);
}

function onPos(pos, center) {
  const { latitude: lat, longitude: lng } = pos.coords;
  ME.km = kmBetween({ lat, lng }, VENUE);
  const p = project(lat, lng);
  ME.onsite = p.x >= 26 && p.x <= 374 && p.y >= 40 && p.y <= 468;
  if (ME.onsite) { ME.x = p.x; ME.y = p.y; }
  renderPeople(); renderRoute();
  if (view === 'home') renderHome();
  if (center) {
    if (ME.onsite) { go('map'); centerOn(ME.x, ME.y, 220, 0); }
    else toast(t('loc.away', { km: num(ME.km, 1) }));
  }
}
function locate(center) {
  if (!('geolocation' in navigator)) { toast(t('loc.unsup')); return; }
  const btn = $('#zme'); btn.classList.add('busy');
  if (view !== 'map' || !center) toast(t('loc.finding'));
  navigator.geolocation.getCurrentPosition(pos => {
    btn.classList.remove('busy'); btn.classList.add('ok');
    onPos(pos, center);
    if (!ME.watching) {
      ME.watching = true;
      try { ME.watchId = navigator.geolocation.watchPosition(p => onPos(p, false), () => {}, { enableHighAccuracy: true, maximumAge: 15000 }); } catch (_) {}
    }
  }, err => {
    btn.classList.remove('busy');
    toast(err && err.code === 1 ? t('loc.denied') : t('loc.fail'));
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
}

/* pan + zoom via viewBox */
const vb = { x: 0, y: 0, w: 400, h: 600 };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function applyVB() {
  vb.w = clamp(vb.w, 130, 420); vb.h = vb.w * 1.5;
  vb.x = clamp(vb.x, -60, 460 - vb.w); vb.y = clamp(vb.y, -60, 640 - vb.h);
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
}
function animateVB(target) {
  const from = { ...vb }, t0 = performance.now(), dur = reduce ? 0 : 380;
  const step = now => {
    const k = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - Math.pow(1 - k, 3);
    vb.x = from.x + (target.x - from.x) * e; vb.y = from.y + (target.y - from.y) * e; vb.w = from.w + (target.w - from.w) * e;
    applyVB(); if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function centerOn(x, y, w = vb.w, yShift = 0.12) { animateVB({ x: x - w / 2, y: y - w * 1.5 / 2 + w * 1.5 * yShift, w }); }
function zoomBy(f) { const cx = vb.x + vb.w / 2, cy = vb.y + vb.h / 2, nw = clamp(vb.w * f, 130, 420); animateVB({ x: cx - nw / 2, y: cy - nw * 0.75, w: nw }); }

/* touch: one finger pans, two fingers pinch-zoom */
function svgPt(cx, cy) { const p = svg.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const ptrs = new Map();
let drag = null, pinch = null;
svg.addEventListener('pointerdown', e => {
  svg.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, vb: { ...vb }, moved: false, hit: e.target.closest('[data-pin],[data-person]') };
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), vb: { ...vb }, mid: svgPt((a.x + b.x) / 2, (a.y + b.y) / 2) };
    if (drag) drag.moved = true;
  }
});
svg.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    const nw = clamp(pinch.vb.w * pinch.d / Math.max(d, 1), 130, 420), s = nw / pinch.vb.w;
    vb.w = nw; vb.x = pinch.mid.x - (pinch.mid.x - pinch.vb.x) * s; vb.y = pinch.mid.y - (pinch.mid.y - pinch.vb.y) * s; applyVB();
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 6) return;
  drag.moved = true;
  const r = svg.getBoundingClientRect(), k = Math.min(drag.vb.w / r.width, drag.vb.h / r.height);
  vb.x = drag.vb.x - dx * k; vb.y = drag.vb.y - dy * k; applyVB();
});
function endPtr(e) {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size > 0) { drag = null; return; }
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved || e.type === 'pointercancel') return;
  if (meetMode) { placeMeet(svgPt(e.clientX, e.clientY)); return; }
  if (d.hit && d.hit.dataset.pin) openPlace(d.hit.dataset.pin, true);
  else if (d.hit && d.hit.dataset.person) openPerson(d.hit.dataset.person, true);
  else closeSheet();
}
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const p = svgPt(e.clientX, e.clientY), f = e.deltaY > 0 ? 1.12 : 0.89, nw = clamp(vb.w * f, 130, 420), s = nw / vb.w;
  vb.x = p.x - (p.x - vb.x) * s; vb.y = p.y - (p.y - vb.y) * s; vb.w = nw; applyVB();
}, { passive: false });

/* offline map: stores the app in the phone's cache so it opens with no signal */
const OFFLINE_CACHE = 'festigo-offline';
const OFFLINE_FILES = ['./', './index.html', './manifest.webmanifest', './icon.svg', './icon-192.png', './icon-512.png'];
const FONT_CSS = 'https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap';
const offline = (() => { const s = store.get('offline', null); return s ? { state: 'done', at: s.at, pct: 0 } : { state: 'none', at: 0, pct: 0 }; })();
const canCache = () => 'caches' in window && /^https?:$/.test(location.protocol);
function openOffline() {
  sel = null; renderPins(); renderPeople(); sheet.dataset.mode = 'offline';
  let body;
  if (offline.state === 'done') {
    body = `<div class="pills"><span class="pill good">${t('off.saved')}</span><span class="pill">${t('off.updated', { x: fmtClock(new Date(offline.at)) })}</span></div>
      <p class="sh-p">${t('off.doneP')}</p>
      <div class="acts"><button class="btn pri" data-act="dl">${svgI('download')}${t('off.update')}</button><button class="btn" data-act="dl-del">${t('off.remove')}</button></div>`;
  } else if (offline.state === 'loading') {
    const p = Math.min(100, Math.floor(offline.pct));
    body = `<div class="prog" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>
      <p class="sh-p" style="font-family:var(--f-mono)">${t('off.dl', { p })}</p>`;
  } else {
    body = `<p class="sh-p">${t('off.intro')}</p>
      <ul class="menu"><li><span>${t('off.i1')}</span><span>✓</span></li><li><span>${t('off.i2')}</span><span>✓</span></li></ul>
      <div class="acts"><button class="btn pri" data-act="dl">${svgI('download')}${t('off.btn')}</button></div>`;
  }
  sheet.innerHTML = sheetHead('#5BB8FF', '#0F0D2E', 'download', t('off.title'), 'Brisa Fest · Marina Sur') + body;
  sheet.classList.add('open');
}
async function startDownload() {
  if (offline.state === 'loading') return;
  offline.state = 'loading'; offline.pct = 0; openOffline();
  const anim = setInterval(() => { offline.pct = Math.min(94, offline.pct + 6 + Math.random() * 10); if (sheet.dataset.mode === 'offline') openOffline(); }, 160);
  try {
    if (canCache()) {
      const c = await caches.open(OFFLINE_CACHE);
      await Promise.all(OFFLINE_FILES.map(u => c.add(u).catch(() => {})));
      try { const fr = await fetch(FONT_CSS, { mode: 'no-cors' }); await c.put(FONT_CSS, fr); } catch (_) {}
      if (!(await c.match('./index.html')) && !(await c.match('./'))) throw new Error('not cached');
    }
    await wait(700);
    offline.state = 'done'; offline.at = Date.now(); store.set('offline', { at: offline.at });
    toast(t('off.okT'));
  } catch (_) {
    offline.state = 'none'; toast(t('off.failT'));
  } finally {
    clearInterval(anim); renderLegend();
    if (sheet.classList.contains('open') && sheet.dataset.mode === 'offline') openOffline();
  }
}
async function removeDownload() {
  try { if ('caches' in window) await caches.delete(OFFLINE_CACHE); } catch (_) {}
  offline.state = 'none'; store.set('offline', null); renderLegend(); openOffline(); toast(t('off.removedT'));
}
$('#zoff').onclick = openOffline;

/* =========================================================
   LINEUP
   ========================================================= */
const PX = 1.1, G0 = 18 * 60, G1 = 30 * 60;  // 18:00 to 06:00
function clashesFor(set) {
  if (!favs.has(set.id)) return [];
  return ALLSETS.filter(s => s.id !== set.id && s.day === set.day && favs.has(s.id) && s.start < set.end && set.start < s.end);
}
function renderLineup() {
  $$('#days button').forEach(b => b.classList.toggle('on', b.dataset.day === day));
  $$('#mode button').forEach(b => b.classList.toggle('on', b.dataset.mode === luMode));
  const sets = setsFor(day), fn = festNow(), isLive = !!fn && fn.day === day, n = isLive ? fn.min : 0;
  $('#planN').textContent = sets.filter(s => favs.has(s.id)).length;
  const head = $('#ttHead');
  head.hidden = luMode !== 'grid';
  head.innerHTML = '<span></span>' + STAGES.map(s => `<div style="--c:${s.c}">${s.short}</div>`).join('');

  let html = '';
  if (isLive) {
    const live = sets.filter(s => s.start <= n && n < s.end);
    html += `<div class="live-strip"><span class="live">${t('onstage')}</span>${live.length ? live.map(s => `<div><b>${esc(s.name)}</b><span class="st" style="color:${s.stage.c}">${s.stage.short} · ${t('until.l', { x: s.b })}</span></div>`).join('') : `<div>${t('allchange')}</div>`}</div>`;
  }
  if (luMode === 'grid') {
    let hours = '', cols = '';
    for (let m = G0; m <= G1; m += 60) hours += `<div class="hr" style="top:${(m - G0) * PX}px"><span>${pad((m / 60) % 24)}</span></div>`;
    STAGES.forEach((st, i) => {
      cols += `<div class="col" style="grid-column:${i + 2}">` + sets.filter(s => s.stage.id === st.id).map(s => {
        const fav = favs.has(s.id), clash = clashesFor(s).length > 0;
        const live = isLive && s.start <= n && n < s.end, past = isLive && s.end <= n;
        return `<button class="set ${fav ? 'fav' : ''} ${clash ? 'clash' : ''} ${past ? 'past' : ''}" data-set="${s.id}" style="--c:${st.c}; top:${(s.start - G0) * PX + 1}px; height:${(s.end - s.start) * PX - 3}px" aria-pressed="${fav}">
          <svg class="star" viewBox="0 0 24 24">${IC.star}</svg>
          ${live ? `<span class="lv">${S.lang === 'es' ? 'EN VIVO' : 'LIVE'}</span>` : ''}<span class="tm">${s.a}–${s.b}</span><span class="an">${esc(s.name)}</span><span class="gn">${s.genre}</span></button>`;
      }).join('') + '</div>';
    });
    const now = isLive && n >= G0 && n <= G1 ? `<div class="nowline" data-t="${fmt(n)}" style="top:${(n - G0) * PX}px"></div>` : '';
    html += `<div class="tt-body" style="height:${(G1 - G0) * PX + 10}px">${hours}<div class="col" style="grid-column:1"></div>${cols}${now}</div>`;
  } else {
    const mine = sets.filter(s => favs.has(s.id)).sort((a, b) => a.start - b.start);
    html += mine.length ? `<div class="plan">${mine.map(s => {
      const cl = clashesFor(s);
      return `<div class="prow"><div class="t"><b>${s.a}</b>${s.b}</div>
        <div class="n"><b>${esc(s.name)}</b><span class="stg" style="--c:${s.stage.c}">${s.stage.name}</span> <span>· ${s.genre}</span>
        ${cl.length ? `<span class="warn">${t('clashes', { x: cl.map(c => esc(c.name)).join(', ') })}</span>` : ''}</div>
        <button data-set="${s.id}" aria-label="${esc(t('remove.aria', { n: s.name }))}"><svg viewBox="0 0 24 24">${IC.star}</svg></button></div>`;
    }).join('')}</div>` : `<div class="empty"><b>${t('plan.empty.t', { d: t('dayfull.' + day) })}</b>${t('plan.empty.p')}</div>`;
  }
  $('#ttWrap').innerHTML = html;
}
function scrollToNow() {
  const v = $('[data-view="lineup"]'), fn = festNow();

    video.srcObject = cam.stream;
    video.classList.toggle('mirror', facing === 'user');
    await video.play().catch(() => {});
    if (!video.videoWidth) await new Promise(r => { video.onloadedmetadata = () => r(); setTimeout(r, 1500); });
    $('#shutter').disabled = false;
    return true;
  } catch (err) { camError(err && err.name); return false; }
}
function grabFrame(mirror, w, h) {
  const vw = video.videoWidth, vh = video.videoHeight; if (!vw || !vh) return null;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'), s = Math.max(w / vw, h / vh), iw = vw * s, ih = vh * s;
  if (mirror) { x.translate(w, 0); x.scale(-1, 1); }
  x.drawImage(video, (w - iw) / 2, (h - ih) / 2, iw, ih);
  return c.toDataURL('image/jpeg', .82);
}
function fileToDataURL(file, w, h) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'), s = Math.max(w / im.width, h / im.height), iw = im.width * s, ih = im.height * s;
      x.drawImage(im, (w - iw) / 2, (h - ih) / 2, iw, ih); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    im.src = url;
  });
}
function buzz(p) { try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(p); } catch (_) {} }
function flash() { const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); buzz(30); }
function updateCamTimer() {
  const el = $('#camTimer'), left = momState().left;
  el.textContent = left > 0 ? mmss(left) : '+' + mmss(left);
  el.classList.toggle('late', left <= 0);
}
function setStep(step) {
  cam.step = step;
  $('#camStep').textContent = step === 'back' ? '1/2' : '2/2';
  $('#camMsg').textContent = step === 'back' ? t('cam.point') : t('cam.front');
  $('#camThumb').hidden = step === 'back' || !cam.back;
  if (cam.back) $('#camThumb').src = cam.back;
}
async function openCam() {
  const m = momState();
  if (m.posted) { toast(t('t.already')); return; }
  if (!m.active) { toast(t('t.notyet')); return; }
  cam.back = cam.front = null; cam.busy = false;
  $('#cam').hidden = false; $('#camShoot').style.display = 'flex'; $('#review').hidden = true;
  $('#count3').hidden = true;
  setStep('back');
  $('#camMsg').textContent = t('cam.starting'); $('#shutter').disabled = true;
  updateCamTimer();
  if (await startStream(cam.facing)) $('#camMsg').textContent = t('cam.point');
}
function closeCam() { stopStream(); $('#cam').hidden = true; cam.busy = false; }
async function takeSelfie() {
  const other = cam.facing === 'user' ? 'environment' : 'user';
  setStep('front');
  if (!(await startStream(other))) return;
  $('#shutter').disabled = true;
  const c3 = $('#count3'); c3.hidden = false;
  for (const n of [3, 2, 1]) { c3.textContent = n; await wait(650); }
  c3.hidden = true;
  const img = grabFrame(other === 'user', 360, 480);
  flash(); stopStream();
  cam.front = img; showReview();
}
function showReview() {
  cam.busy = false;
  $('#rvBack').src = cam.back; $('#rvBack').alt = t('rv.back');
  const f = $('#rvFront');
  if (cam.front) { f.hidden = false; f.src = cam.front; f.alt = t('rv.front'); } else f.hidden = true;
  $('#rvWhereRow').hidden = !ME.onsite;
  if (ME.onsite) $('#rvWhere').textContent = t('near', { x: nearestPlace(ME).name });
  $('#camShoot').style.display = 'none'; $('#review').hidden = false;
}
$('#camClose').addEventListener('click', closeCam);
$('#camFlip').addEventListener('click', async () => {
  if (cam.step !== 'back' || cam.busy) return;
  cam.facing = cam.facing === 'environment' ? 'user' : 'environment';
  $('#shutter').disabled = true; await startStream(cam.facing);
});
$('#shutter').addEventListener('click', async () => {
  if (cam.busy || cam.step !== 'back') return;
  const img = grabFrame(cam.facing === 'user', 720, 960); if (!img) return;
  cam.busy = true; flash(); cam.back = img;
  await wait(250);
  await takeSelfie();
});
$('#camRetry').addEventListener('click', async () => {
  const ok = await startStream(cam.step === 'back' ? cam.facing : (cam.facing === 'user' ? 'environment' : 'user'));
  if (ok && cam.step === 'front') { cam.busy = true; await takeSelfie(); }
});
$('#fileGallery').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  try { cam.back = await fileToDataURL(f, 720, 960); cam.busy = true; flash(); await takeSelfie(); } catch (_) {}
});
$('#fileNative').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    if (cam.native === 'back') {
      cam.back = await fileToDataURL(f, 720, 960);
      setStep('front'); camError(EMBED ? 'embed' : 'unsupported');
      $('#camErrMsg').textContent = t('cam.selfieNative');
    } else {
      cam.front = await fileToDataURL(f, 360, 480); showReview();
    }
  } catch (_) {}
});
$('#rvFront').addEventListener('click', () => { if (!cam.front) return; [cam.back, cam.front] = [cam.front, cam.back]; $('#rvBack').src = cam.back; $('#rvFront').src = cam.front; });
$('#rvRetake').addEventListener('click', openCam);
$('#rvPost').addEventListener('click', () => {
  const m = momState();
  const post = { back: cam.back, front: cam.front, at: Date.now(), cap: $('#rvCap').value.trim(), place: ME.onsite ? nearestPlace(ME).name : '' };
  POSTS[m.key] = post;
  /* keep the last 7 days only */
  const keep = new Set(Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - i); return dayKey(d); }));
  Object.keys(POSTS).forEach(k => { if (!keep.has(k)) delete POSTS[k]; });
  const ok = store.set('posts', POSTS);
  $('#rvCap').value = '';
  closeCam(); go('momento');
  toast(ok ? t('t.posted') : t('t.storefail'));
});
document.addEventListener('visibilitychange', () => { if (document.hidden && cam.stream) { stopStream(); if (!$('#cam').hidden && cam.step === 'back') $('#shutter').disabled = true; } else if (!document.hidden && !$('#cam').hidden && !cam.stream && $('#review').hidden && cam.step === 'back') startStream(cam.facing); });

/* =========================================================
   live ticks
   ========================================================= */
let wasActive = momState().active;
function tick() {
  const m = momState();
  if (m.active && !wasActive && !m.posted) {
    if (S.momAlerts) { showBanner(); systemNotify('FestiGo · Momento', t('notif.s')); buzz([120, 60, 120]); }
    if (view !== 'momento') $('#mDot').hidden = false;
    if (view === 'momento') renderMomento();
    if (view === 'home') renderHome();
  }
  wasActive = m.active;
  if (!$('#cam').hidden) updateCamTimer();
  if (view === 'momento' && m.active && !m.posted) renderBanner();
  if (view === 'home') tickHome();
}
setInterval(tick, 1000);
setInterval(() => {
  if (festNow()) {
    PLACES.forEach(p => { if (p.wait != null) p.wait = clamp(p.wait + Math.round((Math.random() - .5) * 2.4), 0, 15); });
    renderPins();
    if (sheet.classList.contains('open') && sel && !(sel in PEOPLE)) openPlace(sel);
  }
  checkReminders();
  if (view === 'lineup' && luMode === 'grid' && festNow()) renderLineup();
  if (view === 'home') renderHome();
}, 30000);

/* ---------- boot ---------- */
applyStatic(); setHeader();
$('#zoneFood').textContent = t('zone.food');
renderChips(); renderPins(); renderPeople(); renderLegend(); applyVB();
go('home');
{ const m = momState(); if (m.active && !m.posted) { $('#mDot').hidden = false; if (m.left > 0 && S.momAlerts) setTimeout(showBanner, 800); } }
if (!store.get('welcomed', false)) showWelcome();
if (new URLSearchParams(location.search).has('join')) setTimeout(() => go('friends'), 0);

/* offline support + install */
if (EMBED) { $('#zme').hidden = true; $('#zoff').hidden = true; $('#camFlip').style.visibility = 'hidden'; }
if (!EMBED && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
